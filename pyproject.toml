[project]
name = "sup"
version = "0.1.0"
description = "Ingests the Bluesky Jetstream firehose, stores it durably, and transforms it into a queryable data mart, with an operational TUI and analytics dashboard."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Joshua Lizana", email = "josh.lizana@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aioduckdb==0.1.0",
    "aiosqlite==0.22.1",
    "duckdb==1.5.5",
    "orjson==3.12.0",
    "platformdirs==4.11.3",
    "pydantic==2.13.4",
    "streamlit==1.59.2",
    "textual==8.2.8",
    "typer==0.27.1",
    "websockets==17.0.1",
]

[project.scripts]
sup = "sup:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
