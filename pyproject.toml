[project]
name = "sup"
version = "0.1.0"
description = "Ingests the Bluesky Jetstream firehose, stores it durably, and transforms it into a queryable data mart, with an operational TUI and analytics dashboard."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Joshua Lizana", email = "josh.lizana@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
sup = "sup:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
